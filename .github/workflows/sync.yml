name: 同步通用约定

on:
  push:
    branches: [main]
    paths: [AGENTS.md]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: mousebaoyan
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          gh auth setup-git
          git config --global user.name "$APP_SLUG[bot]"
          git config --global user.email "$(gh api "/users/$APP_SLUG[bot]" --jq .id)+$APP_SLUG[bot]@users.noreply.github.com"
          ./sync.sh mousehole:pr mouseclock:pr astrbot_plugin_mousehole:push mousebaoyan.github.io:push
